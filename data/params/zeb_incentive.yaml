등급판정:
  # ⚠️ 「제로에너지건축물 인증 기준」은 **공동고시**다 — 한쪽 부처만 인용하면 오류.
  source: >-
    제로에너지건축물 인증 기준 (국토교통부고시 제2024-893호 /
    산업통상자원부고시 제2024-208호, 2024-12-30 일부개정) 별표1·별표1의2·별표2
  url: https://law.go.kr/행정규칙/제로에너지건축물인증기준
  effective_from: 2025-01-01
  status: 확인됨_원문대조              # 2026-07 딥리서치 · 국가법령정보센터 현행 조회로 확정
  원문근거: |
    국가법령정보센터(law.go.kr, admRulSeq=2100000251410, 현행) 헤더 축자:
    "제로에너지건축물 인증 기준 [시행 2025. 1. 1.]
     [국토교통부고시 제2024-893호, 2024. 12. 30., 일부개정]
     [시행 2025. 1. 1.] [산업통상자원부고시 제2024-208호, 2024. 12. 30., 일부개정]"
    → 893은 국토교통부 번호, 208은 산업통상자원부 번호. '산업통상자원부고시 제2024-893호'는
      부처 귀속 오류다.
  소관부처_변경:
    note: |
      ZEB 인증 소관이 산업통상자원부 → 기후에너지환경부로 이관 중이다.
      「제로에너지건축물 인증에 관한 규칙」= 기후에너지환경부령 제1호(2025.10.1 타법개정),
      녹색건축법 시행령 §12 = "국토교통부와 기후에너지환경부의 공동부령"(2025.10.1 개정).
      단 위 '인증 기준' 고시 자체는 2024-12-30 개정본이 현행이므로 고시번호는 그대로 쓴다.
    원문: data/policy_docs/12_ZEB_인증규칙.pdf
  자립률_정식: 순생산량 ÷ 총소요량 × 100
  총소요량_정의: 1차에너지소요량 + 순생산량
  자립률_검증: 확인됨_원문대조         # 별표1 원문 PDF 확보로 산식 확정 (2026-07 딥리서치)
  보정계수_대지외생산:               # 대지 내 자립률 구간별 — 별표1 원문 확인
    - [10, 0.7]
    - [15, 0.8]
    - [20, 0.9]
    - [.inf, 1.0]
  최종등급규칙: 제1호(자립률) 또는 제2호(1차에너지소요량) 중 상위 등급
  필수요건: 제3호 BEMS 13개 항목 전부 (미비 시 등급 무관 인증 불가)
  등급구간_비주거_제2호:              # kWh/㎡·년 '미만' — 한국에너지공단·한국부동산원·KRIEA 3곳 일치
    status: 확인됨_원문대조
    원문근거: |
      한국에너지공단 ZEB 통합 인증시스템(zeb.energy.or.kr/BC/BC03/BC03_05_002.do),
      한국부동산원(지정 인증기관), KRIEA 3개 공식 소스가 동일 값을 게시:
      비주거 ZEB+ <-70 / ZEB1 <-30 / ZEB2 <10 / ZEB3 <50 / ZEB4 <90 / ZEB5 <130
      한국부동산원 축자: "제1호 또는 제2호 중 높은 등급신청 기준을 ZEB 인증등급으로 함",
      "인증을 취득하기 위해서는 제1호 또는 제2호와 제3호를 만족하여야 함"
    비주거: {"+": -70, "1": -30, "2": 10, "3": 50, "4": 90, "5": 130}
    주거:   {"+": -10, "1": 10, "2": 30, "3": 50, "4": 70, "5": 90}
  등급구간_제1호_자립률:              # % '이상' — 20%p 등간격
    status: 확인됨_원문대조
    값: {"+": 120, "1": 100, "2": 80, "3": 60, "4": 40, "5": 20}
  주거_비주거_판정:                   # 별표2 주5 — 2026-07 팀 학습문서 v4로 정정
    status: 확인됨_원문대조
    원문근거: |
      ZEB 인증기준 별표2 주5: "주거용 = 단독주택 + 공동주택(**기숙사 제외**)"
      → 기숙사·업무시설·노유자시설·교육연구시설 등은 전부 **비주거용**.
      (도담 = 노유자시설(어린이집) → 비주거용)
    정정: |
      🔴 core.zeb_evaluator.RESIDENTIAL_USES에 **기숙사가 들어 있었다**(주거로 분류).
         주거 기준이 더 엄격해(5등급 90 vs 130) 기숙사를 주거로 재면 등급이 과소평가된다 —
         예: net 100 → 주거로 재면 '인증 미달', 비주거로 재면 'ZEB 5등급'.
         오피스텔도 제거(건축법상 업무시설이라 별표2 주5의 '공동주택'이 아님).
    주거용: [단독주택, 공동주택, 주택, 아파트, 연립주택, 다세대주택]

  열관류율_별표1:                     # 06 에너지절약설계기준 [별표1]
    source: 국토교통부고시 제2025-738호 [별표1] 지역별 건축물 부위의 열관류율표
    status: 확인됨_원문대조             # 2026-07 원문 PDF(p.19) 직접 파싱 검증
    원문근거: |
      "[별표1] 지역별 건축물 부위의 열관류율표 (단위: W/㎡·K)
       거실의 외벽 · 외기에 직접 면하는 경우:
         공동주택    0.150 / 0.170 / 0.220 / 0.290 이하  (중부1/중부2/남부/제주)
         공동주택 외 0.170 / 0.240 / 0.320 / 0.410 이하
       창 및 문 · 외기에 직접 면하는 경우:
         공동주택         0.900 / 1.000 / 1.200 / 1.600 이하
         공동주택 외 창   1.300 / 1.500 / 1.800 / 2.200 이하"
    정정: |
      🔴 우리 U_VALUE_LIMITS는 **공동주택(주거) 값을 모든 용도에 쓰고 있었다.**
         도담(어린이집=비주거)에 주거 기준을 적용해 실제보다 엄격하게 채점했다.
         (중부2 외벽 0.170 대신 0.240이 맞고, 창 1.000 대신 1.500이 맞다)
         기존 주석에도 "실제 06 PDF [별표1] 값과 비교 검증 후 사용 권장"이라 적혀
         있었으나 검증되지 않은 채 돌고 있었다. 팀 학습문서 v4 p.10이 짚어줘 확인.
      → U_VALUE_LIMITS(비주거·기본) / U_VALUE_LIMITS_RES(주거) 분리 +
        u_limits(region, is_residential) 조회 함수 신설.
    구현: core/bim_diagnoser.py


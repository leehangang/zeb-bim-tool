# ZEB 인센티브 파라미터 — Track A
# 원칙: 하드코딩 금지. 값은 반드시 source/effective_from와 함께 둔다.
#       엔진은 이 표를 결정론적으로 조회한다(LLM 경유 금지).
meta:
  track: ZEB
  updated: 2026-07-15
  note: 팀 학습문서 v4 부록 A·B 대조 완료

취득세감면:
  source: 지방세특례제한법 제47조의2 제2항 / 시행령 제24조
  url: https://www.law.go.kr/법령/지방세특례제한법
  effective_until: 2026-12-31        # 감면 기한
  status: 확인됨
  적용조건:
    대상: 신축·증축·개축한 부분만          # ⚠️ 기존 건축물 단순 리모델링은 대상 아님(0원)
    비대상: 기존 건축물 성능개선 리모델링(증축 없음)
    추징: 취득일부터 3년 이내 인증 취소 시 감면분 추징
  등급별감면율:                        # 학습문서 부록 B-2 확인
    "+": 0.20
    "1": 0.20
    "2": 0.20
    "3": 0.20                        # (정정) 기존 코드 0.18 → 0.20
    "4": 0.18
    "5": 0.15
  취득세율_업무시설: 0.022

재산세감면:
  source: 지방세특례제한법 제47조의2 제5항
  status: 폐지                        # ⚠️ 2018-12-31 종료 — 현행 아님
  effective_until: 2018-12-31
  적용: false
  note: ROI 편익에 절대 포함하지 말 것. (ROI 방향성 메모의 '재산세 감면' 언급은 오류)

용적률높이완화:
  source: 녹색건축물 조성 지원법 시행령 제11조 / 건축물의 에너지절약설계기준 별표9
  effective_from: 2025-12-31
  status: 확인됨
  등급별최대완화율:
    "+": 0.15
    "1": 0.15
    "2": 0.14
    "3": 0.13
    "4": 0.12
    "5": 0.11
  계산식: 완화후 = 기준값 × (1 + 완화율)
  자립률기준: 대지 내 순생산량만 반영 (별표1 주4)
  실현조건: 증축을 실제 수행해야 편익 발생        # ⚠️ 증축 없으면 실익 없음 → 금액화 주의

인증수수료:
  source: 제로에너지건축물 인증 기준 고시 제2024-893호 별표4
  effective_from: 2025-01-01
  status: 확인됨
  구분: 비주거(단독·공동주택 제외, 기숙사 포함)
  부가세: 별도
  전용면적구간_원:                      # (상한㎡, 수수료)
    - [1000, 1900000]
    - [3000, 3900000]                # 도담 1,251㎡ → 390만원
    - [5000, 5900000]
    - [10000, 7900000]
    - [15000, 9900000]
    - [20000, 11900000]
    - [30000, 13900000]
    - [40000, 15900000]
    - [60000, 17800000]
    - [.inf, 19800000]

수수료환불:
  source: 제로에너지건축물 인증 기준 고시 제2024-893호 제6조제3항제5호 나목
  status: 확인됨
  적용조건: 의무 대상이 아닌 건물이 자율(임의) 인증을 받은 경우에만
  등급별환불율:
    "+": 1.00
    "1": 1.00
    "2": 1.00
    "3": 1.00
    "4": 0.50
    "5": 0.30
  note: 도담은 자율 대상 → 실질 편익. 단 별동증축·전부개축 포함 시 의무가 되어 환불 소멸.

의무대상판정:
  source: 녹색건축물 조성 지원법 제17조 제6항 / 시행령 제12조·별표1
  effective_from: 2026-03-31
  status: 확인됨_원문대조                # 2026-07 시행령 원문(제36231호) 직접 확인
  원문근거: |
    시행령 제12조④ "연면적이 1천제곱미터 이상인 건축물: 4등급 (다만 특수성으로
    4등급 이상이 곤란하면 공동부령으로 완화) / 그 외: 5등급"
    시행령 제12조③ 인증등급 = 플러스·1·2·3·4·5등급
  요건_모두충족:
    - 소유·관리 주체가 공공기관·교육감·공공주택사업자
    - 공사범위가 신축·재축·전부개축·별동증축 중 하나
  의무등급:
    연면적_1000㎡_이상: "4"
    연면적_1000㎡_미만: "5"
  도담판정: 자율(임의)              # 단순 리모델링 → 공사범위 요건 미충족

등급판정:
  source: 제로에너지건축물 인증 기준 고시 제2024-893호 별표1·별표1의2·별표2
  effective_from: 2025-01-01
  status: 확인됨
  소관부처_변경:                      # 2026-07 원문 대조로 확인
    note: |
      ZEB 인증 소관이 이관됨. 「제로에너지건축물 인증에 관한 규칙」은
      기후에너지환경부령 제1호(2025.10.1 타법개정)로 개정됐고,
      녹색건축법 시행령 제12조는 "국토교통부와 기후에너지환경부의 공동부령"으로
      개정(2025.10.1)됐다. 기존 '산업통상자원부고시' 표기는 갱신 필요.
    원문: data/policy_docs/12_ZEB_인증규칙.pdf
  자립률_정식: 순생산량 ÷ 총소요량 × 100
  총소요량_정의: 1차에너지소요량 + 순생산량
  보정계수_대지외생산:               # 대지 내 자립률 구간별
    - [10, 0.7]
    - [15, 0.8]
    - [20, 0.9]
    - [.inf, 1.0]
  최종등급규칙: 제1호(자립률) 또는 제2호(1차에너지소요량) 중 상위 등급
  필수요건: 제3호 BEMS 13개 항목 전부 (미비 시 등급 무관 인증 불가)
  평가실내온도: {냉방: 26, 난방: 20}   # 별표3
  공식산정도구: ECO2                  # ISO 13790 월간 계산, 에너지공단 무료 배포

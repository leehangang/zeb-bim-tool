  용도별보정계수_제2호:               # 2026-07-16 출처 확보 — 다만 우리 구조로는 반영 불가
    status: 확인됨_원문대조_우리구조로는_반영불가
    원문근거: |
      별표2 주7 축자: "제2호에 등급산정 기준은 별표1 제1호에 따른 연간 단위면적당
      1차에너지소요량에서 제10조에 따라 운영기관의 장이 운영세칙으로 정하는
      **용도별 보정계수를 반영한 결과**이다."

      → 그 '운영세칙'을 찾았다. 「(한국에너지공단) 건축물 에너지효율등급 인증 및
        제로에너지건축물 인증 제도 운영규정」[시행 2023.11.15] **[별표2] 용도프로필**이다.
        (law.go.kr schlPubRulSeq=2200000087233 — 무료 공개. '비공개'가 아니었다.)
        규정 제7조① "용도프로필과 기상데이터는 각각 [별표 2], [별표 6]과 같으며"
    출처: https://www.law.go.kr/schlPubRulInfoP.do?chrClsCd=010202&schlPubRulSeq=2200000087233

    실제구조: |
      별표2는 **23개 용도프로필**이고, 각 프로필이 사용시간·최소도입외기량·급탕요구량·
      조명시간·열발열원(사람/작업보조기기)·설정온도·월간사용일수와 함께
      **용도별 보정계수(난방·냉방·급탕·조명·환기)** 를 담는다.
      🔑 **건물 단위가 아니라 공간(zone) 단위다.** ECO2는 실별로 프로필을 배정한다.

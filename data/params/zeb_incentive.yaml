인증수수료:
  source: 제로에너지건축물 인증 기준 공동고시 별표4 제2호
  effective_from: 2025-01-01
  status: 확인됨_원문대조              # 2026-07-16 별표4 원문 직접 대조 (구간·금액 10/10 일치)
  원문: data/policy_docs/19_ZEB_인증기준_공동고시.txt
  원문근거: |
    별표4 "2. 단독주택 및 공동주택을 제외한 건축물(기숙사 포함)" 축자:
      1천㎡ 미만 190만원 / 1천~3천㎡ 390만원 / 3천~5천㎡ 590만원 / 5천~1만㎡ 790만원
      1만~1만5천㎡ 990만원 / 1만5천~2만㎡ 1,190만원 / 2만~3만㎡ 1,390만원
      3만~4만㎡ 1,590만원 / 4만~6만㎡ 1,780만원 / 6만㎡ 이상 1,980만원
      ※ 비고: 인증 수수료 금액은 부가가치세 별도
    주1) 전용면적 = 인증 신청 건축물의 **용적률 산정용 연면적**. 다만 지하층 바닥면적
         합계(지하주차장 제외)가 전체 연면적의 50% 이상이면 연면적(지하주차장 제외) 기준 가능.
    → 도담 1,251㎡ → 390만원. 우리 표와 일치.
  구분: 비주거(단독·공동주택 제외, 기숙사 포함)

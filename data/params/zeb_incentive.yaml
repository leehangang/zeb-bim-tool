수수료환불:
  source: 제로에너지건축물 인증 기준 공동고시 제6조제3항제5호 나목
  status: 확인필요_적용례쟁점          # ⚠️ 2026-07-16 원문 확보로 오히려 문제가 드러남
  원문: data/policy_docs/19_ZEB_인증기준_공동고시.txt
  원문근거: |
    제6조제3항제5호 나목 축자: "녹색건축물 조성 지원법 제17조제6항 및 지자체 조례
    등에서 정한 제로에너지건축물 인증 **의무대상이 아닌 건축물**로서 다음 요건에
    해당하는 등급을 취득한 건축물
      1) +등급∼3등급 : 납입한 인증 수수료의 전부
      2) 4등급 : 100분의 50
      3) 5등급 : 100분의 30"
    → 등급별 환불율 자체는 우리 값과 일치한다.
  적용례_쟁점: |
    🔴 그런데 부칙 <제2020-574호, 2020. 8. 13.> 제2조(인증수수료에 관한 적용례)가
       이렇게 못박고 있다:
         "제6조제3항제5호나목의 개정규정은 **2024.12.31일까지** 제로에너지건축물
          인증을 신청한 건에 한하여 적용한다."
       현행 고시(제2024-893호, 2025.1.1 시행) 부칙에는 이 기한을 연장하는 조항이 없다.
       오늘(2026-07)은 그 기한을 이미 1년 반 지났다.
    → 문면대로면 도담의 수수료 환불 78만원(390만원 × 30%)은 **더 이상 적용되지 않는다**.
       다만 부칙 적용례의 실효 여부는 운영기관 유권해석 사안이라 단정하지 않는다.
    → 확인처: 한국에너지공단 ZEB 운영기관 / 운영세칙
  적용조건: 의무 대상이 아닌 건물이 자율(임의) 인증을 받은 경우에만
  등급별환불율:
    "+": 1.00
    "1": 1.00
    "2": 1.00
    "3": 1.00
    "4": 0.50
    "5": 0.30
  note: |
    도담은 자율 대상 → 문면상 환불 대상. 단 위 적용례 쟁점으로 실제 수령 여부는 미확정.
    별동증축·전부개축 포함 시 의무가 되어 환불 소멸.


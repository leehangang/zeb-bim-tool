        목록: 주거공간 / 소규모사무실 / 대규모사무실 / 회의실·세미나실 / 강당 / 구내식당 /
              화장실 / 그 외 체류공간 / 부속공간 / 창고·설비·문서실 / 전산실 / 주방·조리실 /
              병실 / 객실 / 교실(초중고) / 강의실(대학) / 매장 / 전시실 / 열람실(도서관) /
              체육시설 / 구내식당(초중고) / 주방·조리실(초중고) / 체육시설(초중고)
        → 실제 ECO2 해석에서는 **모델러가 보육실을 어느 프로필에 배정하느냐**로 갈린다.
          '교실(초중고)'(난방 1.964)에 넣느냐 '그 외 체류공간'(난방 1)에 넣느냐에 따라
          결과가 크게 달라진다. 이건 우리가 정할 수 있는 게 아니라 **인증기관 실무 판단**이다.
      우리구조의_한계: |
        우리 엔진은 건물 전체를 **하나의 용도(어린이집=비주거)** 로 보고 base 200 하나를 쓴다.
        ECO2는 **실별 zone에 프로필을 배정**해 각각 보정계수를 적용한다.
        구조가 다르므로 보정계수를 우리 숫자에 곱하는 것으로는 재현되지 않는다.
        → **곱해서 흉내내지 않는다.** 그럴듯한 숫자가 나오지만 ECO2 값이 아니다.
    조치: |
      우리 등급은 '보정계수 미반영 · 단일 용도 가정'임을 화면에 명시한다(이미 표기 중).
      제대로 하려면 실별 zone 분할 + 프로필 배정이 필요하고, 그건 ECO2 정식 해석의 영역이다.

  # ── ECO2 계산법 (2026-07-16 매뉴얼 원문 확인) ───────────────────
  ECO2_계산법:
    status: 확인됨_원문대조
    원문근거: |
      ECO2 매뉴얼 ver17 (한국에너지공단 건물에너지실, 2022-04-13) p.4 [프로그램 개발 방법] 축자:
        "**ISO 13790 과 DIN V 18599 을 기준으로** 업무용 건물에 대한 에너지 평가기법 마련"
      → 월별 준정상상태(monthly quasi-steady-state) 계산법.
      매뉴얼 전문에 '52016' **0회**.
    url: https://beec.energy.or.kr/BC/BC04/FileDown.do?key=3559
    고시와의_관계: |
      ⚠️ 공동고시 제4조①1호는 "**ISO 52016 등 국제규격**에 따라 … 제작된 프로그램을 활용한다"고
      쓰는데, 이건 ECO2가 52016을 구현한다는 뜻이 **아니다.**
      고시 연혁 8개판 확인: 2013-248~2017-76은 "ISO 13790" → **2018-675(시행 2019.3.1)에서
      "ISO 52016"으로 개정**. 개정이유가 스스로 "기타 조문 정비 … 개정된 국제표준 사항을 반영"
      이라 분류한다 — **13790이 폐지(Withdrawn)되니 번호만 따라간 문구 정리**이고
      계산 엔진 변경이 아니다. ECO2는 그 뒤로도 13790 월별법 그대로다.
      또한 고시 8개판 전문에 'ECO2'·'DIN'·'18599' **0건** — **고시는 ECO2를 지정하지 않는다.**
      (같은 문구가 에너지절약설계기준 §22에도 있는 국토부 공통 보일러플레이트)

  두_자립률_분리:                     # 별표1 주4
    status: 확인됨_원문대조            # 2026-07-16 공동고시 별표1 주4 원문 직접 대조
    원문근거: |
      별표1 주4 축자: "「녹색건축물 조성 지원법」 제15조 및 시행령 제11조에 따른
      **건축기준 완화 시 대지 내** 단위면적당 1차에너지 순생산량**만을** 고려한
      에너지자립률을 기준으로 적용한다."
      별표1 제2호 나목 3) ※도 같은 취지: "대지 내 에너지자립률 산정 시 …
      대지 내 연간 단위면적당 1차에너지 순생산량만을 고려한다."
    설명: |
      자립률은 목적에 따라 **두 개**를 따로 계산해야 한다:
        · 등급 판정용 = 대지 내 + 대지 외×보정계수   → evaluate_zeb()["autonomy_pct"]
        · 완화 판정용 = **대지 내만** (별표1 주4)     → ["autonomy_pct_onsite_only"]
      값이 다르다. 예: 대지 외 20kW만 있으면 등급용 40.4% / 완화용 0.0%.
      완화(용적률·높이)에 등급용을 쓰면 없는 완화를 계상하게 된다.
    BIM_필드: pv_panels[].onsite (true=대지 내 · 미표기 시 true로 간주)

  최종등급규칙: 제1호(자립률) 또는 제2호(1차에너지소요량) 중 상위 등급
  필수요건: 제3호 BEMS 13개 항목 전부 (미비 시 등급 무관 인증 불가)
  등급구간_비주거_제2호:              # kWh/㎡·년 '미만'
    status: 확인됨_원문대조            # 2026-07-16 공동고시 별표2 원문 직접 대조
    원문근거: |
      「제로에너지건축물 인증 기준」 별표2 축자 (data/policy_docs/19_ZEB_인증기준_공동고시.txt):
        등급 | 제1호 자립률(%) | 제2호 주거용 | 제2호 비주거용
         +  |   120 이상     |  -10 미만   |  -70 미만
         1  |   100 이상     |   10 미만   |  -30 미만
         2  |    80 이상     |   30 미만   |   10 미만
         3  |    60 이상     |   50 미만   |   50 미만
         4  |    40 이상     |   70 미만   |   90 미만
         5  |    20 이상     |   90 미만   |  130 미만
      주1. "제1호 또는 제2호와 제3호를 만족하여야 한다"
      주2. "제1호 또는 제2호 중 높은 등급산정 기준을 ZEB 인증등급으로 한다"
      → 이전에 2차 출처(에너지공단·부동산원·KRIEA)로 맞춰둔 값이 원문과 전부 일치했다.
    비주거: {"+": -70, "1": -30, "2": 10, "3": 50, "4": 90, "5": 130}
    주거:   {"+": -10, "1": 10, "2": 30, "3": 50, "4": 70, "5": 90}
  등급구간_제1호_자립률:              # % '이상' — 20%p 등간격
    status: 확인됨_원문대조            # 2026-07-16 별표2 원문 대조
    값: {"+": 120, "1": 100, "2": 80, "3": 60, "4": 40, "5": 20}
  주거_비주거_판정:                   # 별표2 주5
    status: 확인됨_원문대조            # 2026-07-16 공동고시 별표2 원문 직접 대조
    원문근거: |
      별표2 주5 축자: "제2호에서 주거용이란 「건축법 시행령」 별표1 중
      **단독주택 및 공동주택(기숙사 제외)**을 말하며, 비주거용이란 주거용을 제외한
      모든 건축물을 말한다."
      별표1 주3도 같은 정의를 쓴다: "주거용 건축물(단독주택 및 기숙사를 제외한 공동주택)"
      → 기숙사·업무시설·노유자시설·교육연구시설 등은 전부 **비주거용**.
      (도담 = 노유자시설(어린이집) → 비주거용)
      팀 학습문서 v4로 정정했던 내용이 원문으로 확정됐다.
    정정: |
      🔴 core.zeb_evaluator.RESIDENTIAL_USES에 **기숙사가 들어 있었다**(주거로 분류).
         주거 기준이 더 엄격해(5등급 90 vs 130) 기숙사를 주거로 재면 등급이 과소평가된다 —
         예: net 100 → 주거로 재면 '인증 미달', 비주거로 재면 'ZEB 5등급'.
         오피스텔도 제거(건축법상 업무시설이라 별표2 주5의 '공동주택'이 아님).
    주거용: [단독주택, 공동주택, 주택, 아파트, 연립주택, 다세대주택]

  열관류율_별표1:                     # 06 에너지절약설계기준 [별표1]
    source: 국토교통부고시 제2025-738호 [별표1] 지역별 건축물 부위의 열관류율표
    status: 확인됨_원문대조             # 2026-07 원문 PDF(p.19) 직접 파싱 검증
    원문근거: |
      "[별표1] 지역별 건축물 부위의 열관류율표 (단위: W/㎡·K)
       거실의 외벽 · 외기에 직접 면하는 경우:
         공동주택    0.150 / 0.170 / 0.220 / 0.290 이하  (중부1/중부2/남부/제주)
         공동주택 외 0.170 / 0.240 / 0.320 / 0.410 이하
       창 및 문 · 외기에 직접 면하는 경우:
         공동주택         0.900 / 1.000 / 1.200 / 1.600 이하
         공동주택 외 창   1.300 / 1.500 / 1.800 / 2.200 이하"
    정정: |
      🔴 우리 U_VALUE_LIMITS는 **공동주택(주거) 값을 모든 용도에 쓰고 있었다.**
         도담(어린이집=비주거)에 주거 기준을 적용해 실제보다 엄격하게 채점했다.
         (중부2 외벽 0.170 대신 0.240이 맞고, 창 1.000 대신 1.500이 맞다)
         기존 주석에도 "실제 06 PDF [별표1] 값과 비교 검증 후 사용 권장"이라 적혀
         있었으나 검증되지 않은 채 돌고 있었다. 팀 학습문서 v4 p.10이 짚어줘 확인.
      → U_VALUE_LIMITS(비주거·기본) / U_VALUE_LIMITS_RES(주거) 분리 +
        u_limits(region, is_residential) 조회 함수 신설.
    구현: core/bim_diagnoser.py


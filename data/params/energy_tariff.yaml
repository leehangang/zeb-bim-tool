  교체이력_2026_07_16: |
    🔴 종전 값 **9,900원/㎡** (= 1,251㎡ × 9,900 ≈ 1,238만원). 근거 없는 매직넘버였고
       kWh 절감량과 연결이 끊겨 있어 ZEB 엔진이 절감률을 고쳐도 ROI는 꿈쩍하지 않았다.
       앱은 이를 "BIM 정밀 산정"이라 표기하고 있었다.
    → 한전 약관 원문 단가 확보로 계산식 교체. **5,172원/㎡ — 옛 값은 1.91배 과대**였다.
       연간 절감 1,238만원 → **647만원**, 회수기간도 그만큼 늘어난다.
       이 방향은 KEEI 기본연구보고서 2025-14(GR 522동 실측 = 예측의 60%)와
       **독립적으로 일치**한다. 설계단계 예측이 실측보다 크다는 것.

  남은가정:
    전량_전기_가정: |
      도담의 실제 연료 구성(전기/가스)은 미확인. 경북 노유자시설 전기 비중은 82.2%
      (건물에너지사용량통계 2024). 가스분이 있으면 환산계수가 1.1이라 같은 1차E에 대해
      site kWh가 커져 절감액은 이보다 **커진다** → 현재 값은 **보수적**이다.
    절감kWh_자체가_미확정: |
      base 200 kWh/㎡·년과 요소별 절감률 11개는 아직 문헌 근거가 없다.
      단가는 확정됐지만 곱해지는 kWh가 추정치라 절감액도 추정치다. ECO2 해석으로 확정할 것.
    계절가중_단순화: |
      월수 가중(여름3·봄가을5·겨울4)은 '월별 사용량 균등'을 전제한다.
      실제로는 냉난방으로 여름·겨울에 몰리므로 실효단가가 이보다 높을 수 있다.
      ECO2 월간 kWh 확보 시 사용량 가중으로 교체.
  확인필요:
    - 도담 실제 연료 구성 (전기 전용인가, 가스 병용인가) → 고지서
    - 저압(갑Ⅰ) vs 고압(갑Ⅱ) → 단가가 완전히 달라짐
    - 사회복지시설 복지할인 30% 적용 여부 → 적용되면 절감액도 30% 감소
    - base 200 · 요소별 절감률 11개 → ECO2


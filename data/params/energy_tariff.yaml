# 에너지 단가 파라미터 — kWh 절감량 → 원 환산
#
# ⚠️ 현재 최대 구멍:
#    앱의 "연간 에너지 절감 1,238만원 (BIM 정밀 산정)"은 사실
#    1,251㎡ × 9,900원/㎡ 라는 단일 매직넘버다 (core/roi_tools.py).
#    ZEB 엔진이 산출하는 kWh 절감량과 연결이 끊겨 있고, 연료원 구분도 없다.
#    → 아래 표를 채워 kWh × 단가로 결정론적 환산해야 한다.
#
# 원칙: 값은 반드시 source/effective_from와 함께. 엔진이 표를 직접 조회(LLM 경유 금지).
#       요금표는 계절×시간대×계약종별 매트릭스라 RAG로 셀을 고르게 하면 조용히 틀린다.
meta:
  updated: 2026-07-15
  status: 미완성_확인필요
  blocking: ROI 정확도의 최대 병목


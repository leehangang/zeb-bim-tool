# ── ① 전기요금 (한국전력 기본공급약관) ──────────────────────────
전기:
  source: 한국전력공사 기본공급약관 [별표1] 월간 전기요금표
  effective_from: 2026-07-01        # 2026.7.1 시행판 약관 원문에서 직접 추출
  status: 확인됨_원문대조            # 2026-07-16 리서치로 승격 (종전: 확인필요)
  원문근거: |
    한전 「기본공급약관」 [별표1] 월간 전기요금표 (2026.7.1 시행) — 일반용전력(갑)Ⅰ 저압:
      기본요금 6,160원/kW
      전력량요금 여름철 132.4 / 봄·가을철 91.9 / 겨울철 119.0 원/kWh
    계절 구분은 약관 제67조⑧ — 여름철 6/1~8/31, 봄·가을철 3/1~5/31·9/1~10/31,
    겨울철 11/1~익년 2월말.
    적용대상은 제57조②1호 — 계약전력 4kW 이상 300kW 미만 + 저압(110/220/380V).
    ⚠️ 취득처가 한전 공식 도메인이 아닌 미러(ppainfo.com)다. 공식 원본 재확보 시 재검증할 것.
  계약종별: 일반용전력(갑) I 저압    # ← 어린이집 = 일반용 확정. 근거는 아래 계약종별_판정
  계약종별_판정:
    결론: 일반용전력 (교육용 아님)
    근거: |
      약관 제58조①(교육용전력) 적용대상 열거에 「영유아보육법」이 **없다**.
      제58조①1호는 "「유아교육법」·초중등교육법·고등교육법에 따른 **학교**"만 든다.
      시행세칙 제41조③3호가 그 범위를 풀어쓰며 "「유아교육법」에 따른 **유치원**"만 규정한다.
      → 약관 전문·시행세칙 전문에 "어린이집"·"영유아보육법" 출현 0건.
      → 제57조①1호 잔여조항("주택용·교육용·산업용·농사용·가로등·예비·임시 이외의 고객")
        에 따라 **일반용전력**.
    유치원과_다른_이유: |
      유치원 = 유아교육법상 **학교** / 어린이집 = 영유아보육법상 **보육시설**.
      약관이 "학교"를 기준으로 열거하므로 갈린다. 통설("유치원=교육용, 어린이집=일반용")이 맞다.
  단가_원_per_kWh:                  # 갑Ⅰ 저압 (계약전력 4kW 이상 300kW 미만)
    기본요금_원_per_kW: 6160
    여름철: 132.4                   # 6/1~8/31
    봄가을철: 91.9                  # 3/1~5/31, 9/1~10/31
    겨울철: 119.0                   # 11/1~익년 2월말
  부과금_원_per_kWh:
    기후환경요금: 9.0               # ⚠️ status 주의 — 아래 기후환경요금_한계 참고
    연료비조정요금: 5.0             # 2026년 3분기(7~9월분), 상한 +5원 17분기 연속 유지
  세금_요율:
    부가가치세: 0.10                # 부가가치세법 §30 표준세율
    전력산업기반기금: 0.027         # 전기사업법 시행령 §36 "1천분의 27", 2025-07-01 시행

  # 2026-07-16 리서치 — 종전에 우리가 적어둔 두 가지가 **틀렸다**
  정정_2026_07_16:
    우리가_틀린것_1_TOU개편이_우리케이스와_무관: |
      🔴 종전 이 파일은 "2026-06-01 TOU 전면개편으로 **구조**가 바뀌었으니 어떤 스냅샷도
         도담에 대입할 수 없다"고 적고, 그걸 이유로 단가를 비워뒀다. **틀렸다.**
         약관 별표3 제1호와 부칙(2026.3.16) 경과조치 5호는 TOU 적용대상을
         **일반용(갑)Ⅱ · 일반용(을) · 교육용(을)** 로 한정한다.
         **저압 갑Ⅰ은 계시별 대상이 아니다.** 도담이 저압이면 개편과 무관하고
         계절별 단일요금(132.4/91.9/119.0)만 적용된다.
      → 즉 "구조가 바뀌어 못 쓴다"는 우리 결론이 단가 확보를 스스로 막고 있었다.
    우리가_맞았던것_KEPCO_페이지_stale: |
      ✅ 이건 사실로 재확인됐다. home.kepco.co.kr .../CYEEHP00102.html 은
         '적용일자 2013년 01월 14일' 값(기본 5,990원, 여름 102.90/봄가을 64.10/겨울 88.80)을
         현행처럼 게시 중이다. 실제와 봄가을 기준 **43% 차이**. 인용 금지 유지.
         공공데이터포털 '연도별 전기요금표'도 2025-01-01판이라 현행 아님.
    확보경로: |
      한전 「기본공급약관」 2026.7.1 시행판 PDF 별표1을 직접 추출·대조했다.
      ⚠️ 다만 취득처가 한전 공식 도메인이 아닌 미러(ppainfo.com)다 —
         공식 도메인 리다이렉트로 취득 실패. 공식 원본 재확보 시 재검증할 것.

  기후환경요금_한계: |
    ⚠️ 9.0원/kWh는 **한전 공식 원문 근거가 아니다.**
    약관 별표7은 기후환경요금을 산식(RPS+ETS+석탄감축+캐시백 ÷ 판매전력량)으로만 규정하고
    단가 수치를 담지 않는다. 시행세칙에도 없다. 9.0원은 KESIS(에너지경제연구원)+언론 기준이다.
    변동 이력(5.3원 '21 → 7.3원 '22.4 → 9.0원 '23.1)은 복수 출처가 일관되나
    "9.0원 / 시행 2023.1.1"이 병기된 한전 공식 문서는 못 찾았다.

  확인필요:
    - 도담 **저압(갑Ⅰ) vs 고압(갑Ⅱ)** — 단가를 좌우하는 최대 변수. 실제 계약 확인 필요.
      저압이면 위 표 그대로, 고압이면 갑Ⅱ 계시별(선택Ⅰ~Ⅳ)로 완전히 달라진다.
    - 사회복지시설 복지할인(약관 §67⑥3호, 전기요금의 30%) 적용 여부 — **단정 불가**.
      약관 본문은 "시장·군수·구청장에게 **신고**한" 시설로 한정하는데 어린이집은
      영유아보육법 §13상 **인가**다. 그런데 한전 시행세칙 별지4호 서식은 구비서류로
      "**인·허가증** 또는 신고필증"을 받는다 — 약관 본문과 세칙 서식이 불일치하고
      어린이집이 정확히 그 틈에 있다. 게다가 소유자가 KEPCO(공기업)라 국공립 경로도 아니다.
      → 한전 김천지사 실무 확인이 유일한 확정 방법. 공식 유권해석 못 찾음.


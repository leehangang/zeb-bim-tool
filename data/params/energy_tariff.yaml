  조사결과_2026_07:
    결론: 못찾음_다만_구조적_사실_확보
    부과기준_구조: |
      ⚠️ 우리의 '연면적 × 원/㎡' 방식은 KDHC 부과기준과 원리적으로 불일치한다.
      KDHC 열요금표 축자: 주택용 기본요금 '계약면적 ㎡당 52.40원' /
      업무용 '계약용량 1Mcal/h당 396.79원' / 공공용 '계약용량 1Mcal/h당 361.98원'.
      → **면적 기준 기본요금은 주택용에만 존재**한다. 업무용·공공용은 계약용량(Mcal/h) 기준.
      도담은 비주거이므로 면적 비례 단가 자체가 부과기준에 없다.
      이 사실은 요금 값이 변동해도 유지되는 구조적 속성이다.
    게시현황: |
      KDHC 공식 페이지는 2024-07-01 단일 시행일만 게시(주택용 난방 112.32 /
      업무용 난방 145.82원/Mcal). 2025-07-01 동결 공지는 있으나 실제 값이 .hwp 첨부
      내부라 미확인. 2026년 요금표 미게시. 조정은 홀수월(1,3,5,7,9,11)에 발생.
    주의: 공공용 127.34원/Mcal을 엔진에 직접 대입하는 것은 3-0으로 기각됐다 — 건물 실제 열원
          확인 없이 대입 금지.

# ── 1차에너지 환산계수 (연료원 → 1차에너지) ─────────────────────
1차에너지환산계수:
  source: ZEB 인증기준 고시 제2024-893호 제10조 위임 (ECO2 내장)
  status: 확인됨
  전력: 2.75
  지역난방: 0.728
  가스: 1.1
  기타연료: 1.1
  note: ECO2에 내장돼 자동 적용됨. 우리 엔진도 동일 계수 사용 중.
  소관부처_변경: |
    ZEB 인증 소관이 산업통상자원부 → 기후에너지환경부로 이관됐다.
    「제로에너지건축물 인증에 관한 규칙」= 기후에너지환경부령 제1호(2025.10.1 타법개정),
    녹색건축법 시행령 §12 = "국토교통부와 기후에너지환경부의 공동부령"(2025.10.1 개정).
    → 기존 '산업통상자원부고시' 표기는 stale. 계수값 자체는 변동 없음.
    (2026-07 원문 대조: data/policy_docs/12_ZEB_인증규칙.pdf)

# ── 현재 엔진이 실제로 쓰는 값 (임시 가정) ──────────────────────
현재가정:
  status: 임시가정_근거없음
  annual_energy_saving_won_per_m2: 9900
  위치: core/roi_tools.py
  문제:
    - kWh 절감량과 연결 안 됨 (ZEB 엔진의 절감률·소요량과 독립)
    - 연료원(전기/가스/열) 구분 없음
    - 출처·시행일자 없음
    - 앱은 이를 "BIM 정밀 산정"으로 표기 중 → 표현 정정 필요
  검산: 1251 * 9900 = 12384900   # ≈ 1,238만원 (앱 헤드라인 수치)
  대체계획: |
    절감액(원) = Σ_연료원 [ 절감kWh(연료원) × 단가(연료원, 계절·시간대) ]
    - 절감kWh는 ECO2(ZEB) / EnergyPlus(GR 성능개선비율)에서 산출
    - 단가는 위 표에서 결정론적 조회
    - 에너지 단가 상승률(escalation)은 별도 파라미터 유지


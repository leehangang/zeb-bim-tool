전기:
  source: 한국전력공사 기본공급약관 별표 (전기요금표)
  url: https://cyber.kepco.co.kr/ckepco/front/jsp/CY/E/E/CYEEHP00101.jsp
  effective_from: null              # ⚠️ 확인 필요
  status: 확인필요
  계약종별: 일반용(갑) I / 일반용(갑) II / 일반용(을)   # 도담=어린이집 → 계약종별 확인 필요
  # 2026-07 딥리서치 결과 — 값을 채우지 못한 이유를 기록한다 (추정치로 메우지 말 것)
  조사결과_2026_07:
    결론: 못찾음
    함정_1_KEPCO_공식페이지가_stale: |
      home.kepco.co.kr .../CYEEHP00102.html 은 '적용일자 : 2013년 01월 14일' 값을
      아카이브 표기 없이 현행처럼 게시 중이다(일반용(갑)Ⅰ 저압 기본 5,990원/kW,
      여름 102.90 / 봄가을 64.10 / 겨울 88.80원/kWh).
      2025-04-01 기준(기본 6,160원/kW, 여름 132.4 / 봄가을 91.9 / 겨울 119.0)과 비교하면
      전력량요금이 여름 29% · 봄가을 43% 과소다. 자매 페이지(주택용)도 동일하게 2013년 값.
      → 이 페이지를 그대로 긁으면 13년 묵은 값을 '현행'으로 믿게 된다. 사용 금지.
    함정_2_요금_구조가_바뀜: |
      2026-06-01부로 일반용·교육용 계시별(TOU) 요금제가 1977년 이후 첫 전면 개편으로 시행됐다
      (산업용(을)은 2026-04-16). 즉 2026년 단가는 '값'만 바뀐 게 아니라 '구조'가 바뀌었으므로
      어떤 과거 스냅샷도 도담 케이스에 대입할 수 없다.
      주간(11~15시) 최대 약 16.9원/kWh 인하, 저녁(18~21시) 인상.
      2026-06부터 6개월 TOU/정액 병행청구, 2026-12부터 고객 선택.
    확보경로: |
      2026-06-01 개정 기본공급약관 원문에서 직접 확보해야 한다.
      data.go.kr '연도별 전기요금표'는 데이터기준일자 2025-01-01이라 2026년을 담지 못한다.
  확인필요:
    - 도담 계약종별(갑I/갑II/을)·계약전력 → 실제 전기요금 고지서로 확인 (추정 금지)
    - 2026-06-01 개정 기본공급약관 원문 확보
    - 계절·시간대 구분 적용 여부 (저압/고압에 따라 다름)
    - ECO2/EnergyPlus 결과는 월간 kWh → 계절·TOU 시간대 매핑 필요


  url: https://www.kdhc.co.kr/kdhc/main/contents.do?menuNo=200270
  effective_from: 2024-07-01        # KDHC 공식 게시 최신본 (2026년 요금표 미게시)
  status: 확인필요
  적용: null                        # 도담(김천)은 KDHC 공급구역 밖일 가능성 높음 → 무관할 수 있음

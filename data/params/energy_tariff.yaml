# ── 1차에너지 환산계수 (연료원 → 1차에너지) ─────────────────────
1차에너지환산계수:
  source: ZEB 인증기준 고시 제2024-893호 제10조 위임 (ECO2 내장)
  status: 확인됨
  전력: 2.75
  지역난방: 0.728
  가스: 1.1
  기타연료: 1.1
  note: ECO2에 내장돼 자동 적용됨. 우리 엔진도 동일 계수 사용 중.
  소관부처_변경: |
    ZEB 인증 소관이 산업통상자원부 → 기후에너지환경부로 이관됐다.
    「제로에너지건축물 인증에 관한 규칙」= 기후에너지환경부령 제1호(2025.10.1 타법개정),
    녹색건축법 시행령 §12 = "국토교통부와 기후에너지환경부의 공동부령"(2025.10.1 개정).
    → 기존 '산업통상자원부고시' 표기는 stale. 계수값 자체는 변동 없음.
    (2026-07 원문 대조: data/policy_docs/12_ZEB_인증규칙.pdf)

# ── 현재 엔진이 실제로 쓰는 값 (임시 가정) ──────────────────────
현재가정:
  status: 임시가정_근거없음
  annual_energy_saving_won_per_m2: 9900
  위치: core/roi_tools.py
  문제:
    - kWh 절감량과 연결 안 됨 (ZEB 엔진의 절감률·소요량과 독립)
    - 연료원(전기/가스/열) 구분 없음
    - 출처·시행일자 없음
    - 앱은 이를 "BIM 정밀 산정"으로 표기 중 → 표현 정정 필요
  검산: 1251 * 9900 = 12384900   # ≈ 1,238만원 (앱 헤드라인 수치)
  대체계획: |
    절감액(원) = Σ_연료원 [ 절감kWh(연료원) × 단가(연료원, 계절·시간대) ]
    - 절감kWh는 ECO2(ZEB) / EnergyPlus(GR 성능개선비율)에서 산출
    - 단가는 위 표에서 결정론적 조회
    - 에너지 단가 상승률(escalation)은 별도 파라미터 유지


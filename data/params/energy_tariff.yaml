  status: 확인필요
  계약종별: 일반용(갑) I / 일반용(갑) II / 일반용(을)   # 도담=어린이집 → 계약종별 확인 필요
  구조:
    기본요금_원_per_kW: null
    전력량요금_원_per_kWh:
      여름철:  {경부하: null, 중간부하: null, 최대부하: null}
      봄가을철: {경부하: null, 중간부하: null, 최대부하: null}
      겨울철:  {경부하: null, 중간부하: null, 최대부하: null}
    기후환경요금_원_per_kWh: null
    연료비조정액_원_per_kWh: null
  확인필요:
    - 도담 계약종별(갑I/갑II/을) 확정
    - 계절·시간대 구분 적용 여부 (저압/고압에 따라 다름)
    - ECO2/EnergyPlus 결과는 월간 kWh → 계절 구분 매핑 필요


  원문근거: "그린리모델링 공사비 대출에 대해 취급 금융기관과 대출약정 체결 시 지원기준에 따라 4.5%~5.5% 이자지원"
  이자지원율_범위: [0.045, 0.055]     # 연 4.5% ~ 5.5%

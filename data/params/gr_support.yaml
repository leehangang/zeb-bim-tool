# 그린리모델링(GR) 지원 파라미터 — Track B
# ⚠️ GR은 소유 주체에 따라 편익 구조가 완전히 갈린다.
#    공공 = 사업비 직접 지원(보조금) / 민간 = 은행 대출 이자 보조
#    → ROI 파라미터를 두 세트로 분리한다. (ROI 방향성 메모의 'GR=이자지원'은 민간 트랙에만 해당)
meta:
  track: GR
  updated: 2026-07-15
  근거법: 녹색건축물 조성 지원법 제27조
  고시: 그린리모델링 지원사업 운영 등에 관한 고시 (국토교통부고시 제2023-385호, 2023-07-01)

공통자격:
  source: GR 고시 제9조 제1항 / 제7조 제1항 · 2026년 민간 GR 이자지원 공고 p.3·별지6
  status: 확인됨_원문대조            # 2026-07 자체 RAG로 공고 원문 확인
  성능개선비율_최소: 0.20            # 개선공사 이전 대비 20% 이상
  성능개선비율_분모: 개선공사_이전    # ⚠️ base(용도별 기준요구량)가 아니다 — 아래 원문 참고
  성능개선비율_지표: [에너지요구량, 에너지소요량, 1차에너지소요량]   # 셋 중 택1 (별지6)
  원문근거: |
    2026년 민간건축물 GR 이자지원 사업 공고 p.3:
      "비주거 ➊ : 에너지 성능개선 비율 20% 이상(센터 지정 프로그램 활용)"
      "➊ (에너지성능[프로그램]) 센터가 지정한 프로그램*으로 산출한
        **그린리모델링 공사 이전 대비** 에너지 성능개선** 비율 20% 이상"
      "** 에너지 성능개선 비율은 **개선공사 이전 대비** '에너지 요구량' 또는
        '에너지 소요량' 또는 '1차에너지 소요량'의 성능개선"
    별지6: "에너지시뮬레이션 · 에너지요구량 또는 소요량(또는 1차에너지소요량) <개선전·후>"
    GR 고시 제9조①: "이자지원의 기준은 에너지 시뮬레이션에 따른 성능개선비율이
      20퍼센트 이상일 경우 등으로 한다."
  분모_주의: |
    ⚠️ ZEB 절감률과 분모가 다르다. 섞으면 조용히 틀린다.
       ZEB 절감률     = (base − 개선후) ÷ base       도담 50.5%
       GR 성능개선비율 = (개선전 − 개선후) ÷ 개선전   도담 41.2%   ← 9%p 차이
  성능개선_산정도구: [ECO2, ECO2-OD, GR-E, EnergyStudio, EnergyPlus, IES-VE]
  산정도구_주의: |
    센터 지정 프로그램만 인정된다. **우리 엔진의 간이 추정은 지정 프로그램이 아니다.**
    비주거는 간이평가표 경로가 없어(간이평가표는 단독주택 전용) 시뮬레이션이 필수.
  구현: core/gr_evaluator.py (Track B 자격 판정)
  대상공사_7종_최소1건:
    1: 외벽 단열 공사
    2: 고성능 창호 공사
    3: 고효율 기기(냉난방장치·보일러·LED 조명 중 1건 이상)
    4: 폐열회수형 환기장치 설치공사
    5: BEMS 또는 원격검침전자식 계량기 설치
    6: 신재생에너지 설비    # 가.태양광(전력) / 나.태양열(급탕) / 다.지열 / 라.풍력
    7: 기타 외피성능 향상 공사
  추가지원_제2항: [ESS, 빙축열, 차열도료, 일사조절장치]
  note: 태양광(가목)과 태양열(나목)은 별개 항목. 자립률 기여 방식이 달라 BIM 파싱에서 분리 필수.

# ── 요소별 절감률의 유일한 공식 근거 (2026-07 자체 RAG로 발견) ─────
간이평가표_지역별계수:
  source: 2026년 민간건축물 GR 이자지원 사업 공고 [별지7] 에너지성능개선비율 간이평가표
  status: 확인됨_원문대조
  원문근거: |
    2026년 민간 GR 이자지원 공고 p.17 [별지7] 에너지성능개선비율 간이평가표(단독주택):
      "ㅇ 산정방법: 해당 분야·항목의 지역별계수(%) × 교체비율(면적기준, %)"
      "분야 | 성능개선 검토사항 | 지역별계수(%) Ⓐ [중부1 중부2 남부 제주] |
       교체비율(%) Ⓑ | 분야별절감률(%) Ⓒ=Ⓐ×Ⓑ"
      "단열 벽체-내단열 ... 13.2 9.7 10.5 10.4 / (외단열) (16.8)(13.0)(13.8)(12.9)
       지붕 2.7 2.6 3.1 2.3 / 바닥 4.8 4.5 4.1 3.3
       창호 15.4 13.7 13.4 12.6 / 출입문 1.5 1.4 1.6 1.7
       열원설비 6.7 7.0 7.1 7.4 / 조명설비 2.3 2.6 2.5 2.9
       신재생에너지 태양광 5.6 5.7 6.5 6.3 (발전용량 1[kWp]당)"
      "절감률 합계(%) / 절감율 합계 기준(20%이상~30%미만) 만족여부 / (30%이상) 만족여부"
      "※ 신축건축물 지역별 법적 단열기준 및 지역구분은 국토교통부 고시 제2025-738호
        「건축물의 에너지절약설계기준」[별표1]을 따름"
  적용범위: 단독주택 전용            # ⚠️ 비주거(도담)에는 적용 불가 — 비주거는 시뮬레이션 필수
  산정방법: 지역별계수(%) Ⓐ × 교체비율(면적기준 %) Ⓑ = 분야별절감률 Ⓒ, 그 후 **절감률 합계**
  지역구분근거: 국토교통부고시 제2025-738호 「건축물의 에너지절약설계기준」[별표1]
  단위: percent
  계수:                              # [중부1, 중부2, 남부, 제주]
    벽체_내단열:   [13.2, 9.7, 10.5, 10.4]
    벽체_외단열:   [16.8, 13.0, 13.8, 12.9]
    지붕:         [2.7, 2.6, 3.1, 2.3]
    바닥:         [4.8, 4.5, 4.1, 3.3]
    창호:         [15.4, 13.7, 13.4, 12.6]
    출입문:       [1.5, 1.4, 1.6, 1.7]     # 단열두께 20mm 이상
    열원설비:     [6.7, 7.0, 7.1, 7.4]     # 고효율기기(소비효율 1등급)
    조명설비:     [2.3, 2.6, 2.5, 2.9]     # LED
    태양광:       [5.6, 5.7, 6.5, 6.3]     # 발전용량 1kWp 당
  우리값과의_괴리:                   # 도담 = 중부2
    note: |
      core.zeb_evaluator.GR_ENERGY_REDUCTION은 출처가 없었다. 별지7이 유일한 공식 근거인데
      단독주택 기준이라 어린이집에 직접 대입할 수 없다. 그럼에도 **괴리의 방향**은 참고된다:
        창호   우리 8.0%  vs 별지7(중부2) 13.7%   → 우리가 과소
        외벽   우리 15.0% vs 별지7 내단열 9.7% / 외단열 13.0%  → 우리가 과대
        열원   우리 17.0%(냉난방12+보일러5) vs 별지7 7.0%      → 우리가 2.4배 과대
        조명   우리 3.0%  vs 별지7 2.6%          → 대체로 일치
      즉 우리 값은 요소별로 과대·과소가 섞여 있다. 총합이 우연히 비슷해도 구성이 다르다.
    status: 확인필요
    확인필요:
      - 비주거(어린이집) 용도의 요소별 절감률 공식 근거 — 별지7은 단독주택 전용
      - ECO2 정식 해석으로 요소별 기여도 재산출
  ⚠️단순합산_주의: |
    별지7은 '절감률 합계'로 **단순합산**을 쓴다. 그러나 이는
    (1) 단독주택 전용이고 (2) 시뮬레이션이 어려운 경우의 **간이 근사**다.
    비주거는 지정 프로그램 시뮬레이션이 필수이므로 이 합산 방식이 우리 케이스의 근거가 되지 못한다.
    우리 엔진이 1−Π(1−rᵢ)를 쓰는 이유는 zeb_evaluator.combine_reductions 참고.


# 그린리모델링(GR) 지원 파라미터 — Track B
# ⚠️ GR은 소유 주체에 따라 편익 구조가 완전히 갈린다.
#    공공 = 사업비 직접 지원(보조금) / 민간 = 은행 대출 이자 보조
#    → ROI 파라미터를 두 세트로 분리한다. (ROI 방향성 메모의 'GR=이자지원'은 민간 트랙에만 해당)
meta:
  track: GR
  updated: 2026-07-15
  근거법: 녹색건축물 조성 지원법 제27조
  고시: 그린리모델링 지원사업 운영 등에 관한 고시 (국토교통부고시 제2023-385호, 2023-07-01)

공통자격:
  source: GR 고시 제9조 제1항 / 제7조 제1항
  status: 확인됨
  성능개선비율_최소: 0.20            # 리모델링 전후 대비 20% 이상 (기본 조건)
  성능개선_산정도구: [ECO2, ECO2-OD, GR-E, Energy Studio, EnergyPlus, IES-VE]
  대상공사_7종_최소1건:
    1: 외벽 단열 공사
    2: 고성능 창호 공사
    3: 고효율 기기(냉난방장치·보일러·LED 조명 중 1건 이상)
    4: 폐열회수형 환기장치 설치공사
    5: BEMS 또는 원격검침전자식 계량기 설치
    6: 신재생에너지 설비    # 가.태양광(전력) / 나.태양열(급탕) / 다.지열 / 라.풍력
    7: 기타 외피성능 향상 공사
  추가지원_제2항: [ESS, 빙축열, 차열도료, 일사조절장치]
  note: 태양광(가목)과 태양열(나목)은 별개 항목. 자립률 기여 방식이 달라 BIM 파싱에서 분리 필수.

사업유형판정:
  source: GR 고시 제2조 제5호 / 제4조
  status: 확인됨
  공공지원사업:
    대상: 중앙행정기관·지자체·공공기관·교육기관·국공립학교 소유·관리
    지원방식: 사업기획비·시공비 직접 지원
  민간이자지원사업:
    대상: 민간 소유 건축물
    지원방식: 은행 대출 공사비의 이자 전부 또는 일부 보조
  도담판정: 공공지원사업              # 한국전력기술㈜ = 공공기관운영법 §4 공공기관

# ── Track B-1: 공공지원사업 (도담 해당) ──────────────────────────
공공지원:
  source: 2026년 공공건축물 그린리모델링 2.0 사업공고안 (그린리모델링 창조센터)
  url: https://www.greenremodeling.or.kr/n1/business/bus1000.asp
  year: 2026
  note: 연도별 공고로 갱신됨 — 값 고정 금지, 매년 공고 조회
  status: 확인됨_원문대조              # 2026-07 공고 원문 직접 확인
  원문근거: "(지원방식) 서울특별시, 중앙·공공기관은 지원한도 내 해당 사업비의 50%, 그 외 지방자치단체는 70% 지원"
  보조율:
    서울_중앙_공공기관: 0.50          # 도담 해당
    그외_지자체: 0.70
  지원한도_원_per_3.3㎡:
    종합형_일반건축물: 4000000        # 400만원/3.3㎡
    종합형_일반건축물_섬지역: 4800000  # 480만원/3.3㎡ (2026-07 원문 확인)
  사업당상한_원:
    서울_중앙_공공기관: 5000000000    # 50억
    그외_지자체: 7000000000           # 70억
  군집형:
    2~3동: {per_3.3㎡: 3500000, 상한: 15000000000}
    4~5동: {per_3.3㎡: 3500000, 상한: 25000000000}
  총사업규모_원: 168800000000         # 1,688억 국고보조 예산
  대상조건:
    사용승인_경과: 10년 이상 (2016-01-01 이전)   # 도담 2014 → 충족
    선정_전제: 종합사업지원(현장조사·컨설팅) 받은 건물만 본 공모 가능
  국비산식: min(사업비 × 보조율, 유형별한도[원/3.3㎡ × 연면적], 상한액)
  확인필요:
    - 지원용도 목록에 어린이집(영유아보육법)이 명시적으로 없음 → 용도 적격 별도 확인

# ── Track B-2: 민간이자지원사업 (도담 비해당) ────────────────────
